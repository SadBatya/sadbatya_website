name: Deploy sadbatya to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

      - name: Copy env file
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          scp .env ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:${{ secrets.PROJECT_PATH }}/.env.production

      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "
            set -e

            echo '📦 Setup Node...'
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\"
            nvm use 20 2>/dev/null || nvm install 20

            echo '📂 Go to project...'
            cd ${{ secrets.PROJECT_PATH }}

            echo '📥 Pull latest code...'
            git fetch origin main
            git reset --hard origin/main

            echo '📦 Install dependencies...'
            npm ci

            echo '🏗️ Build app...'
            npm run build

            echo '🔄 PM2 restart...'

            # убираем старый процесс если есть конфликт
            pm2 delete sadbatya_website 2>/dev/null || true

            # запускаем на порту 3001
            PORT=3001 pm2 start npm --name 'sadbatya_website' -- start

            pm2 save

            echo '⏳ Wait app start...'
            sleep 5

            echo '🔍 Check PM2...'
            pm2 list

            echo '🔍 Check app...'
            if curl -s http://localhost:3001 > /dev/null; then
              echo '✅ App is running on 3001'
            else
              echo '❌ App not responding'
              exit 1
            fi

            echo '🎉 Deploy success!'
          "

      - name: Send Telegram notification on success
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ *Деплой успешно завершен!*%0A%0A📦 *Проект:* ${{ github.repository }}%0A🌿 *Ветка:* ${{ github.ref_name }}%0A🕐 *Время:* $(date '+%Y-%m-%d %H:%M:%S')%0A🔗 *Commit:* ${{ github.sha }}" \
            -d parse_mode="Markdown"

      - name: Send Telegram notification on failure
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ *Деплой провалился!*%0A%0A📦 *Проект:* ${{ github.repository }}%0A🌿 *Ветка:* ${{ github.ref_name }}%0A🕐 *Время:* $(date '+%Y-%m-%d %H:%M:%S')%0A🔗 *Commit:* ${{ github.sha }}" \
            -d parse_mode="Markdown"